<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot password — Professional Access AuthKit</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="card">
    <div class="brand"><span class="brand-dot"></span> Professional Access AuthKit</div>
    <h1>Reset your password</h1>
    <p class="subtitle">We'll email you a link to reset it. The link expires in 30 minutes.</p>

    <div id="message" class="message" role="alert"></div>

    <form id="forgot-form" novalidate>
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
      </div>
      <button id="submit-btn" type="submit">Send reset link</button>
    </form>

    <div class="links">
      <a href="/login.html">Back to sign in</a>
      <span></span>
    </div>
  </div>

  <script type="module" src="/forgot-password.js"></script>
</body>
</html>
