<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set a new password — Professional Access AuthKit</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="card">
    <div class="brand"><span class="brand-dot"></span> Professional Access AuthKit</div>
    <h1>Set a new password</h1>
    <p class="subtitle">Choose a new password for your account.</p>

    <div id="message" class="message" role="alert"></div>

    <form id="reset-form" novalidate>
      <div>
        <label for="new-password">New password</label>
        <input id="new-password" name="new-password" type="password" autocomplete="new-password" required />
        <p class="hint">At least 8 characters, with a number and a special character.</p>
      </div>
      <div>
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required />
      </div>
      <button id="submit-btn" type="submit">Reset password</button>
    </form>

    <div class="links">
      <a href="/login.html">Back to sign in</a>
      <span></span>
    </div>
  </div>

  <script type="module" src="/reset-password.js"></script>
</body>
</html>
